<!-- Here, this will be the child part where the body will be changed, so only the body content is left while others are removed
Also, here need to call the parent part(to call parent it needs to extended like in OOPS) and show where the child part is to be changed(using block content) -->
{% extends "layout.html" %}
{% block content %}
    <div id="postsContainer">
        {% for post in posts %}
            <article class="content-section py-3 px-4 mb-4">
                <div class="d-flex align-items-start gap-4">
                    <img class="rounded-circle article-img flex-shrink-0"
                         src="{{ post.author.image_path }}"
                         alt="{{ post.author.username }}'s profile picture"
                         width="64"
                         height="64"
                         loading="lazy">
                    <div class="flex-grow-1">
                        <div class="article-metadata mb-2">
                            <a class="me-2"
                               href="#">{{ post.author.username }}</a>
                            <small class="text-body-secondary">{{ post.date_posted }}</small>
                        </div>
                        <h2>
                            <a class="article-title"
                               href={{ url_for("post_page", post_id=post.id) }}>{{ post.title }}</a>
                        </h2>
                        <p class="article-content">{{ post.content }}</p>
                    </div>
                </div>
            </article>
        {% endfor %}
    </div>
    {% if has_more %}
        <div class="text-center mb-4">
            <button type="button" class="btn btn-outline-primary" id="loadMoreBtn">Load More Posts</button>
        </div>
    {% endif %}
{% endblock content %}
